ir_version: '0.1'
kind: workflow_ir
source:
  frontend: nemo_dsl
  file: coding-agent.nemo
workflow:
  id: CodingAgent
  entry: Triage
  exits:
  - Fin
  transition_semantics:
    selection: first_match_by_priority
    no_match: error_unless_exit
inputs:
- id: task
  type: string
- id: cwd
  type: path
capabilities:
- fs.read
- user.elicit
- user.confirm
- fs.write
- os.shell
policies:
- id: before fs.write(path) requires fs.read(path), user.confirm
  kind: before
  trigger:
    capability: fs.write
    bind:
      path:
        kind: arg
        name: path
  requires:
  - capability: fs.read
    args:
      path:
        kind: ref
        ref:
          kind: bound
          name: path
  - capability: user.confirm
- id: deny fs.read(path) if not cwd.contains(path)
  kind: deny
  trigger:
    capability: fs.read
    bind:
      path:
        kind: arg
        name: path
  condition:
    kind: not
    expr:
      kind: method_call
      receiver:
        kind: ref
        ref:
          kind: input
          name: cwd
      method: contains
      args:
      - kind: ref
        ref:
          kind: bound
          name: path
- id: deny fs.write(path) if not cwd.contains(path)
  kind: deny
  trigger:
    capability: fs.write
    bind:
      path:
        kind: arg
        name: path
  condition:
    kind: not
    expr:
      kind: method_call
      receiver:
        kind: ref
        ref:
          kind: input
          name: cwd
      method: contains
      args:
      - kind: ref
        ref:
          kind: bound
          name: path
nodes:
- id: Triage
  annotations:
  - entry
  prompt: Understand user request. Ground your understanding to the codebase.
  reads:
  - ref:
      kind: input
      name: task
    optional: false
    origin: implicit_entry_input
  - ref:
      kind: input
      name: cwd
    optional: false
    origin: implicit_entry_input
  - ref:
      kind: node_output
      node: Clarify
      field: answers
    optional: true
    origin: dsl_stage_input
  writes:
  - name: summary
    type: string
    optional: false
  - name: unclear_points
    type: string[]
    optional: true
  requires:
  - capability: fs.read
  transitions:
  - to: Clarify
    priority: 0
    reason: next_stage_required_input_available
    guard:
      kind: has_value
      ref:
        kind: node_output
        node: Triage
        field: unclear_points
  - to: Plan
    priority: 1
    reason: skip_next_stage_required_input_missing
    guard:
      kind: missing
      ref:
        kind: node_output
        node: Triage
        field: unclear_points
- id: Clarify
  annotations: []
  prompt: Clarify unclear points. Reference specific files and lines if applicable.
  reads:
  - ref:
      kind: node_output
      node: Triage
      field: unclear_points
    optional: false
    origin: dsl_stage_input
  writes:
  - name: answers
    type: string[]
    optional: false
  requires:
  - capability: user.elicit
  transitions:
  - to: Triage
    priority: 0
    reason: backward_ref_loop
    guard:
      kind: always
- id: Plan
  annotations: []
  prompt: |-
    Plan the changes. Reference specific files and lines if applicable.
    Include all necessary details and context so this can be handed off to another agent
  reads:
  - ref:
      kind: node_output
      node: Triage
      field: summary
    optional: false
    origin: dsl_stage_input
  - ref:
      kind: node_output
      node: Clarify
      field: answers
    optional: true
    origin: dsl_stage_input
  - ref:
      kind: node_output
      node: Propose
      field: comments
    optional: true
    origin: dsl_stage_input
  - ref:
      kind: node_output
      node: Verify
      field: summary
    optional: true
    origin: dsl_stage_input
  writes:
  - name: plan
    type: string
    optional: false
  - name: verification_plan
    type: string
    optional: true
  requires:
  - capability: fs.read
  transitions:
  - to: Propose
    priority: 0
    reason: fallthrough
    guard:
      kind: always
- id: Propose
  annotations: []
  prompt: |-
    Propose the plan for user confirmation. Reference specific files and lines if applicable.
    Include all necessary details and context so this can be handed off to another agent
  reads:
  - ref:
      kind: node_output
      node: Plan
      field: plan
    optional: false
    origin: dsl_stage_input
  writes:
  - name: ok
    type: bool
    optional: false
  - name: comments
    type: string
    optional: true
  requires:
  - capability: user.elicit
  - capability: user.confirm
  transitions:
  - to: Apply
    priority: 0
    reason: explicit_transition
    guard:
      kind: if
      cond:
        kind: ref
        ref:
          kind: node_output
          node: Propose
          field: ok
  - to: Plan
    priority: 1
    reason: explicit_transition
    guard:
      kind: if
      cond:
        kind: not
        expr:
          kind: ref
          ref:
            kind: node_output
            node: Propose
            field: ok
- id: Apply
  annotations: []
  prompt: Apply the user confirmed plan. Follow the plan exactly and do not deviate.
  reads:
  - ref:
      kind: node_output
      node: Plan
      field: plan
    optional: false
    origin: dsl_stage_input
  - ref:
      kind: node_output
      node: Propose
      field: comments
    optional: true
    origin: dsl_stage_input
  writes:
  - name: summary
    type: string
    optional: false
  requires:
  - capability: fs.read
  - capability: fs.write
  - capability: os.shell
  transitions:
  - to: Verify
    priority: 0
    reason: next_stage_required_input_available
    guard:
      kind: has_value
      ref:
        kind: node_output
        node: Plan
        field: verification_plan
  - to: Fin
    priority: 1
    reason: skip_next_stage_required_input_missing
    guard:
      kind: missing
      ref:
        kind: node_output
        node: Plan
        field: verification_plan
- id: Verify
  annotations: []
  prompt: Verify the changes. Follow the verification plan exactly and do not deviate.
  reads:
  - ref:
      kind: node_output
      node: Apply
      field: summary
    optional: false
    origin: dsl_stage_input
  - ref:
      kind: node_output
      node: Plan
      field: verification_plan
    optional: false
    origin: dsl_stage_input
  writes:
  - name: ok
    type: bool
    optional: false
  - name: summary
    type: string
    optional: false
  requires:
  - capability: os.shell
  transitions:
  - to: Fin
    priority: 0
    reason: explicit_transition
    guard:
      kind: if
      cond:
        kind: ref
        ref:
          kind: node_output
          node: Verify
          field: ok
  - to: Plan
    priority: 1
    reason: explicit_transition
    guard:
      kind: if
      cond:
        kind: not
        expr:
          kind: ref
          ref:
            kind: node_output
            node: Verify
            field: ok
- id: Fin
  annotations:
  - exit
  prompt: Summarize the changes made. Reference specific files and lines if applicable.
  reads:
  - ref:
      kind: node_output
      node: Apply
      field: summary
    optional: false
    origin: dsl_stage_input
  - ref:
      kind: node_output
      node: Verify
      field: summary
    optional: true
    origin: dsl_stage_input
  writes:
  - name: summary
    type: string
    optional: false
  requires: []
  transitions: []
